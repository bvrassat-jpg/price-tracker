name: price-tracker

on:
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC; each run covers 1/3 of the zones (rotation)
  workflow_dispatch:        # lets you trigger it manually from the Actions tab
    inputs:
      diagnose_id:
        description: "Watchlist id to test in diagnose mode (leave blank for a real run)"
        required: false
        default: ""
      full_run:
        description: "Scrape every zone now, ignoring the 1-day-in-3 rotation (true/false)"
        required: false
        default: "false"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pywebpush

      - name: Run scraper (diagnose mode)
        if: ${{ github.event.inputs.diagnose_id != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scraper.py --diagnose ${{ github.event.inputs.diagnose_id }}

      - name: Run scraper (real run)
        if: ${{ github.event.inputs.diagnose_id == '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SCRAPE_EVERY_N_DAYS: "3"
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          FULL_RUN: ${{ github.event.inputs.full_run }}
        run: python scraper.py
